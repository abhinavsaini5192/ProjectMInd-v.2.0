name: ProjectMind CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      
    - name: Run Tests (Shard 1/4)
      run: npm test -- --shard=1/4 --no-file-parallelism --reporter=verbose

    - name: Run Tests (Shard 2/4)
      run: npm test -- --shard=2/4 --no-file-parallelism --reporter=verbose

    - name: Run Tests (Shard 3/4)
      run: npm test -- --shard=3/4 --no-file-parallelism --reporter=verbose

    - name: Run Tests (Shard 4/4)
      run: npm test -- --shard=4/4 --no-file-parallelism --reporter=verbose
