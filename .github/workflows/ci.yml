name: ProjectMind CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      
    - name: Run Tests (Shard 1/2)
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npm test -- --shard=1/2 --no-file-parallelism

    - name: Run Tests (Shard 2/2)
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npm test -- --shard=2/2 --no-file-parallelism
