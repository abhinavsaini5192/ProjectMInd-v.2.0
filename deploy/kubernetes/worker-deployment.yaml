apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectmind-worker
  namespace: projectmind
  labels:
    app.kubernetes.io/name: projectmind
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: projectmind
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectmind
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: projectmind:latest
          imagePullPolicy: IfNotPresent
          command: ["dumb-init", "--", "node", "dist/platform/main.js", "--role=worker"]
          env:
            - name: PROJECTMIND_ROLE
              value: "worker"
          envFrom:
            - configMapRef:
                name: projectmind-config
            - secretRef:
                name: projectmind-secrets
          ports:
            - name: health
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: storage-data
              mountPath: /app/.projectmind/data
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: projectmind-data-pvc
