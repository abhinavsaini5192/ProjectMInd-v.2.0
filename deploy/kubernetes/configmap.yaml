apiVersion: v1
kind: ConfigMap
metadata:
  name: projectmind-config
  namespace: projectmind
  labels:
    app.kubernetes.io/name: projectmind
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PROJECTMIND_ENV: "production"
  PROJECTMIND_APP_NAME: "projectmind"
  PROJECTMIND_APP_VERSION: "1.0.0"
  PROJECTMIND_LOG_LEVEL: "INFO"
  PROJECTMIND_LOG_FORMAT: "json"
  PORT: "3000"
  HOST: "0.0.0.0"
  PROJECTMIND_STORAGE_TYPE: "sqlite"
  PROJECTMIND_STORAGE_LOCATION: "/app/.projectmind/data"
  PROJECTMIND_DATABASE_WAL: "true"
  PROJECTMIND_DATABASE_BUSY_TIMEOUT_MS: "5000"
  PROJECTMIND_AUTO_MIGRATE: "false"
  PROJECTMIND_WORKER_CONCURRENCY: "5"
  PROJECTMIND_POLL_INTERVAL_MS: "250"
  PROJECTMIND_VISIBILITY_TIMEOUT_MS: "30000"
  PROJECTMIND_CACHE_ENABLED: "true"
  PROJECTMIND_CACHE_TYPE: "redis"
  PROJECTMIND_REDIS_ENABLED: "true"
  PROJECTMIND_REDIS_URL: "redis://projectmind-redis.projectmind.svc.cluster.local:6379"
  PROJECTMIND_REDIS_KEY_PREFIX: "projectmind:"
  PROJECTMIND_SECRET_REDACTION_ENABLED: "true"
  PROJECTMIND_TELEMETRY_ENABLED: "true"
  PROJECTMIND_METRICS_ENABLED: "true"
  PROJECTMIND_ALLOW_UNSAFE_DEV_DEFAULTS: "false"
