# ==============================================================================
# ProjectMind Platform — Example Kubernetes Secret Template
# ==============================================================================
# Base64-encode your secrets before applying, or use external secret operators
# (e.g., HashiCorp Vault, AWS Secrets Manager, GCP Secret Manager).
# NEVER commit unencrypted production credentials into source control.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: projectmind-secrets
  namespace: projectmind
  labels:
    app.kubernetes.io/name: projectmind
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Master encryption key (REQUIRED in production, must be at least 32 characters / 256 bits)
  PROJECTMIND_MASTER_KEY: "replace-with-a-secure-32-byte-or-longer-production-master-key"
  # Base token for authentication when PROJECTMIND_AUTH_MODE=token
  PROJECTMIND_API_KEY: "change-me-to-a-secure-random-token"
  # Session encryption and state protection secret
  PROJECTMIND_SESSION_SECRET: "change-me-to-a-secure-random-session-secret"
  # Redis connection password if password authentication is enabled
  REDIS_PASSWORD: ""
